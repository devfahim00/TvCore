[package]
name = "tvcore-ffi"
description = "C ABI (JSON in / JSON out) for tvcore: Flutter dart:ffi, Kotlin JNA/JNI, Swift, Python ctypes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "tvcore_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tvcore = { path = "../tvcore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
