[package]
name = "tvcore"
description = "Rust core for itcnbd.live: list, search and resolve playable channels"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["http"]
# Built-in HTTP client. Disable it if the host app (Flutter/Kotlin/...) does the
# networking itself and only feeds HTML into `TvCore::load_html`.
http = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.20"
url = "2"
thiserror = "1"
ureq = { version = "3", optional = true }
