[workspace]
resolver = "2"
members = [
    "tvcore",
    "tvcore-ffi",
    "tvcore-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/defahim00/TvCore"
keywords = ["iptv", "live-tv", "m3u", "hls", "ffi"]
categories = ["multimedia", "api-bindings"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
url = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
