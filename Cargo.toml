[workspace]
resolver = "2"
members = ["crates/tvcore", "crates/tvcore-ffi", "crates/tvcore-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["devfahim00"]
repository = "https://github.com/devfahim00/TvCore"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
