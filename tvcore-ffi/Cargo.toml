[package]
name = "tvcore-ffi"
description = "C ABI (FFI) bindings for TvCore — embed live TV listing/search/play into Flutter, Kotlin, Swift, C++"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "tvcore"
# cdylib  -> libtvcore.so / libtvcore.dylib / tvcore.dll (Android, Linux,
#            macOS, Windows Flutter/Kotlin hosts)
# staticlib -> libtvcore.a (iOS static linking)
crate-type = ["cdylib", "staticlib"]
path = "src/lib.rs"

[dependencies]
tvcore = { path = "../tvcore", version = "1.0.0" }
serde_json = { workspace = true }
